[model]
vocab_size = 258
max_length = 12
d_model = 64
n_heads = 4
n_layers = 2
d_ff = 128
dropout = 0.0
mask_token_id = 257
pad_token_id = 256

[diffusion]
schedule = "linear"
schedule_power = 2.0
train_min_t = 0.05
sampling_steps = 12
strategy = "confidence"
temperature = 0.0

[train]
seed = 29
steps = 8000
batch_size = 32
learning_rate = 0.001
weight_decay = 0.0
log_every = 1000
device = "cpu"
corpus_path = "artifacts/decoding-copy-corpus.jsonl"
