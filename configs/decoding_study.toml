[model]
vocab_size = 258
max_length = 24
d_model = 32
n_heads = 4
n_layers = 2
d_ff = 64
dropout = 0.0
mask_token_id = 257
pad_token_id = 256

[diffusion]
schedule = "linear"
schedule_power = 2.0
train_min_t = 0.05
sampling_steps = 12
strategy = "confidence"
temperature = 0.0

[train]
seed = 7
steps = 4
batch_size = 2
learning_rate = 0.001
weight_decay = 0.0
log_every = 1
device = "cpu"

