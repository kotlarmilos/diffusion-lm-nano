[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "diffusion-lm-nano"
version = "0.1.0rc1"
description = "A small discrete masked diffusion language model for an engineering article"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Milos Kotlar" }]
dependencies = ["torch>=2.2"]

[project.scripts]
diffusion-lm-evaluate = "diffusion_lm_nano.evaluate:main"
diffusion-lm-adaptive-study = "diffusion_lm_nano.adaptive_study:main"
diffusion-lm-benchmark = "diffusion_lm_nano.benchmark:main"

[tool.hatch.build.targets.wheel]
packages = ["src/diffusion_lm_nano"]

[tool.unittest]
start-directory = "tests"
